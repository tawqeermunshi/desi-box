<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>DesiBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#F6F5F9;--surface:#FFFFFF;--surface-2:#ECE9F2;--ink:#1D1830;--ink-2:#4B4560;--ink-3:#7A7490;--line:#DDD8E7;--accent:#4E2A84;--accent-ink:#FFFFFF;--accent-soft:#EDE6F7;--accent-text:#4E2A84;--band:#4E2A84;--band-ink:#FFFFFF;--veg:#2C7A4B;--nonveg:#A8321F;--ok:#2C7A4B;--ok-soft:#DDEFE3;--info:#2C5E8A;--info-soft:#DCE8F3;--warn:#8A5A00;--warn-soft:#FBEFD2;--danger:#B3261E;--shadow:0 10px 30px rgba(29,24,48,.14);
--display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121019;--surface:#1B1824;--surface-2:#26222F;--ink:#ECEAF3;--ink-2:#B7B1C6;--ink-3:#8A849B;--line:#343042;--accent:#8C6FC9;--accent-ink:#FFFFFF;--accent-soft:#2B2340;--accent-text:#C4B3EE;--band:#34275A;--band-ink:#FFFFFF;--veg:#5BBE86;--nonveg:#F07A66;--ok:#5BBE86;--ok-soft:#173222;--info:#86B7E4;--info-soft:#172838;--warn:#F4C25C;--warn-soft:#3A2C0C;--danger:#F28B82;--shadow:0 10px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121019;--surface:#1B1824;--surface-2:#26222F;--ink:#ECEAF3;--ink-2:#B7B1C6;--ink-3:#8A849B;--line:#343042;--accent:#8C6FC9;--accent-ink:#FFFFFF;--accent-soft:#2B2340;--accent-text:#C4B3EE;--band:#34275A;--band-ink:#FFFFFF;--veg:#5BBE86;--nonveg:#F07A66;--ok:#5BBE86;--ok-soft:#173222;--info:#86B7E4;--info-soft:#172838;--warn:#F4C25C;--warn-soft:#3A2C0C;--danger:#F28B82;--shadow:0 10px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 110px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,4vw,36px);line-height:1.1}
h2{font-size:20px}
h3{font-size:16px;font-family:var(--body);font-weight:600;letter-spacing:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:18px}
.brand b{font-family:var(--display);font-size:19px;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.live.on i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.top-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
/* generic */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.received{background:var(--surface-2);color:var(--ink-2)}
.pill.cooking{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--info-soft);color:var(--info)}
.pill.delivered,.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.sample{background:transparent;border:1px dashed var(--line);color:var(--ink-3);font-weight:500}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);font-weight:700}
.banner{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink-2);margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* veg mark (FSSAI style) */
.vm{width:14px;height:14px;border:1.5px solid var(--veg);border-radius:2px;display:inline-grid;place-items:center;flex:none}
.vm::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--veg)}
.vm.nv{border-color:var(--nonveg)}
.vm.nv::after{border-radius:0;width:0;height:0;background:none;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid var(--nonveg)}
/* student */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:8px 18px}
.hero p.lede{color:var(--ink-2);margin-top:6px;max-width:52ch}
.deals{background:var(--band);color:var(--band-ink);border-radius:16px;padding:16px;margin-bottom:22px}
.deals-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.deals-h h2{font-size:18px}
.deals-h span{font-size:13px;opacity:.7}
.deal-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.deal{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.deal .top-line{display:flex;gap:8px;align-items:center}
.deal .vm{background:#fff}
.deal .meta{font-size:12px;opacity:.75}
.deal .buy{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.deal s{opacity:.55;margin-left:6px;font-size:13px}
.deals .btn.pri{background:#fff;border-color:#fff;color:#4E2A84}
.left{white-space:nowrap;font-family:var(--mono);font-size:12px;background:#fff;color:#4E2A84;border-radius:6px;padding:1px 6px;margin-left:auto}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:thin}
.day{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;text-align:left;min-width:86px}
.day b{display:block;font-family:var(--display);font-size:17px}
.day span{font-size:12px;color:var(--ink-3)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] span{color:var(--accent-ink);opacity:.8}
.day .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-left:6px;vertical-align:middle}
.cutoff{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);margin-bottom:20px;flex-wrap:wrap}
.cutoff .clock{font-family:var(--mono);font-size:12px;background:var(--surface-2);border-radius:6px;padding:2px 7px}
.cutoff.closed{color:var(--danger)}
.cat{margin-bottom:26px}
.cat-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.cat-h span{font-size:13px;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.dish-h{display:flex;align-items:center;gap:8px}
.dish-h h3{flex:1}
.price{font-family:var(--mono);font-size:14px}
.desc{color:var(--ink-2);font-size:14px}
.inc{font-size:13px;color:var(--ink-3)}
.dish-f{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;gap:8px}
.incart{font-size:12px;font-weight:600;color:var(--accent-text)}
.dish.sold{opacity:.6}
.opts{display:flex;flex-direction:column;gap:2px;margin-block:4px}
.opts .main{font-weight:600;font-size:15px}
.opts .or{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.dish .flabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
/* orders (student) */
.olist{display:flex;flex-direction:column;gap:12px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ocard-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.track div{font-size:12px;color:var(--ink-3)}
.track div::before{content:"";display:block;height:4px;border-radius:2px;background:var(--surface-2);margin-bottom:6px}
.track div.done{color:var(--ink)}
.track div.done::before{background:var(--accent)}
.track div.now{font-weight:700}
.lines{display:flex;flex-direction:column;gap:4px;font-size:14px}
.line{display:flex;justify-content:space-between;gap:10px}
.line .sub{font-size:12px;color:var(--ink-3)}
.ofoot{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.empty{text-align:center;padding:40px 16px;color:var(--ink-3);border:1px dashed var(--line);border-radius:14px}
/* cart bar */
#cartbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.cbar{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);width:min(560px,100%);justify-content:space-between}
.cbar b{font-family:var(--mono)}
/* sheet */
#sheet{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end;background:rgba(10,16,12,.45)}
.panel{background:var(--bg);width:min(480px,100%);height:100%;overflow-y:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
@media (max-width:600px){#sheet{align-items:flex-end}.panel{height:auto;max-height:92%;border-radius:18px 18px 0 0}}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.field textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.step button{border:0;background:transparent;width:32px;height:32px;font-size:17px}
.step button:hover{background:var(--surface-2)}
.step span{min-width:26px;text-align:center;font-family:var(--mono);font-size:14px}
.addon{display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.opt button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-weight:600;font-size:13px;text-align:left}
.opt button small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.opt button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.totals{display:flex;flex-direction:column;gap:4px;font-size:14px}
.totals .line b{font-family:var(--mono)}
.totals .grand{font-size:17px;font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.note{font-size:12px;color:var(--ink-3)}
.success{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding-top:20px}
.tick{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:28px}
/* kitchen */
.k-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-block:8px 16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat span{font-size:12px;color:var(--ink-3);display:block}
.stat b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.slot-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.krow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(140px,1.1fr) minmax(180px,2fr) minmax(150px,1fr) auto;gap:14px;align-items:start;margin-bottom:8px}
@media (max-width:820px){.krow{grid-template-columns:1fr 1fr}.krow .kact{grid-column:1/-1}}
@media (max-width:480px){.krow{grid-template-columns:1fr}}
.krow .who b{display:block}
.krow .who .mono{color:var(--accent-text)}
.kitems{font-size:14px;display:flex;flex-direction:column;gap:2px}
.kitems .sub{font-size:12px;color:var(--ink-3)}
.kact{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
@media (max-width:820px){.kact{flex-direction:row;justify-content:space-between;align-items:center}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin-bottom:4px}
.card>.muted{margin-bottom:12px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
tr:last-child td{border-bottom:0}
.sides{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:14px}
.side{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.side b{font-family:var(--display);font-size:24px;display:block;color:var(--accent-text)}
.side span{font-size:12px;color:var(--ink-2)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:130px 1fr 72px;gap:10px;align-items:center;font-size:13px}
.bar .track2{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.bar .fc{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.bar .v{text-align:right;font-family:var(--mono);font-size:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);margin-right:5px;vertical-align:-1px}
.legend i.l{width:2px;height:12px;background:var(--ink);border-radius:0}
.grid-f th.n{text-align:center}
.grid-f td.cell{text-align:center;font-family:var(--mono);font-size:13px;white-space:nowrap}
.grid-f td.cell small{display:block;font-size:11px;color:var(--ink-3)}
.grid-f td.off{color:var(--ink-3);opacity:.5}
.mrow{display:grid;grid-template-columns:minmax(160px,1.6fr) 70px auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
@media (max-width:760px){.mrow{grid-template-columns:1fr auto;}.mrow .dchips{grid-column:1/-1}}
.mrow .nm{display:flex;gap:8px;align-items:center}
.mrow .nm small{display:block;color:var(--ink-3);font-size:12px}
.dchips{display:flex;gap:4px}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:28px;font-size:11px;font-weight:700;color:var(--ink-3)}
.dchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);border:0;background:transparent;padding:0}
.switch i{width:32px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-pressed="true"] i{background:var(--danger)}
.switch[aria-pressed="true"] i::after{transform:translateX(14px)}
/* planner */
.plan-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.big{font-size:26px}
.plan-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.agent{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:18px;display:flex;flex-direction:column;gap:10px}
.agent.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.agent-h{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.agent-btns{display:flex;gap:8px;flex-wrap:wrap}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.steps li{display:flex;gap:8px;align-items:baseline}
.steps li::before{content:"✓";color:var(--ok);font-weight:700;width:14px;flex:none}
.steps li.now{color:var(--accent-text);font-weight:600}
.steps li.now::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);border-top-color:transparent;align-self:center;margin-right:4px}
@media (prefers-reduced-motion:no-preference){.steps li.now::before{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}

function planItems(date){const p=S.plans[mondayOf(date)];if(!planLive(p))return[];const day=p.days&&p.days[dow(date)];if(!day)return[];
  return ['veg','nv'].filter(t=>day[t]).map((t,i)=>({id:t+'_'+date,date,name:PLAT[t],cat:'meals',price:PRICE,veg:t==='veg',choices:day[t].mains,sides:day[t].starters,baseChoice:true,addons:['chapati','rice','curry'],swapFee:0.5,forecast:day[t].forecast,order:i+1,fromPlan:true}))}
function fcFor(m,date){if(m.forecast!=null)return m.forecast;const wd=dow(date);const h=S.history&&S.history.byDay&&S.history.byDay[wd];if(!h)return null;const a=h[m.id]||h[(m.veg?'veg':'nv')+'_'+wd];return a&&a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null}
const DS=()=>(S.dstats&&S.dstats.dishes)||{};
const WK=()=>(S.weeks&&S.weeks.weeks)||[];
function currentMenuNames(){const ws=menuWeek();const out=new Set();PDAYS.forEach((d,i)=>menuFor(addDays(ws,i)).forEach(m=>(m.choices||[]).forEach(c=>out.add(c))));return out}
function baseline(wd,t){const w=WK();if(!w.length)return t==='veg'?16:22;const last=w.slice(-4).map(x=>x.days[wd]&&x.days[wd][t]?x.days[wd][t].platters:0);
  const avg=last.reduce((a,b)=>a+b,0)/last.length;const tot=x=>PDAYS.reduce((a,d)=>a+(x.days[d]?x.days[d].veg.platters+x.days[d].nv.platters:0),0);
  let trend=1;if(w.length>=4){const r=(tot(w[w.length-1])+tot(w[w.length-2]))/(tot(w[w.length-3])+tot(w[w.length-4]));trend=Math.min(1.1,Math.max(.95,r))}

function cost(n,veg,type){const d=DS()[n];return d?d.cost:(type==='starter'?0.6:(veg?1.5:2.5))}
function forecastPlatter(wd,t,mains,starters){
  const b=baseline(wd,t);const L=mains.map(lift);const n=Math.max(1,Math.round(b*L.reduce((a,x)=>a+x,0)/Math.max(1,L.length)));

function weeksSince(n,ws){const d=DS()[n];if(!d||!d.lastServed)return null;return Math.round((pd(ws)-pd(d.lastServed))/6048e5)}

function validatePlan(days,ws){
  const probs=[];const seen={};const cur=currentMenuNames();let newCount=0;const ds=DS();

    ['veg','nv'].forEach(t=>{const p=day[t];if(!p){probs.push(`${WDF[d]} ${PLAT[t].toLowerCase()} is missing.`);return}
      const mains=(p.mains||[]).map(norm).filter(Boolean),st=(p.starters||[]).map(norm).filter(Boolean);
      if(mains.length!==2)probs.push(`${WDF[d]} ${PLAT[t].toLowerCase()} needs exactly 2 mains.`);
      if(st.length!==2)probs.push(`${WDF[d]} ${PLAT[t].toLowerCase()} needs exactly 2 starters.`);

function rulesPlan(ws){
  const ds=DS();const cur=currentMenuNames();const used=new Set();const days={};
  const mains=t=>Object.entries(ds).filter(([n,d])=>d.type==='main'&&d.veg===(t==='veg')&&!cur.has(n)).map(([n,d])=>({n,d,score:(d.lift||0.95)*(1+Math.min(4,weeksSince(n,ws)||4)*0.02)-(d.cost/PRICE)*0.3})).sort((a,b)=>b.score-a.score);
  const starters=t=>Object.entries(ds).filter(([n,d])=>d.type==='starter'&&(t==='nv'||d.veg)&&(d.swapAway==null||d.swapAway<.15)).map(([n,d])=>({n,s:(d.swapAway??.08)+(cur.has(n)?.03:0)+d.cost*.02})).sort((a,b)=>a.s-b.s);
  const sUsed={};
  PDAYS.forEach((d,i)=>{days[d]={};['veg','nv'].forEach(t=>{const ms=mains(t).filter(x=>!used.has(x.n));
    const fav=ms[0];let rot=ms.slice(Math.floor(ms.length/3)).find(x=>x.n!==fav.n&&!(x.d.riceDish&&fav.d.riceDish)&&x.d.cuisine!==fav.d.cuisine)||ms[1];
    used.add(fav.n);used.add(rot.n);
    const sp=starters(t).sort((a,b)=>(sUsed[a.n]||0)-(sUsed[b.n]||0)||a.s-b.s).slice(0,2);sp.forEach(x=>sUsed[x.n]=(sUsed[x.n]||0)+1);
    days[d][t]={mains:[fav.n,rot.n],starters:sp.map(x=>x.n),why:`${fav.n} is a proven seller; ${rot.n} rotates in.`}})});

/* ---------- Supabase adapter (GitHub Pages build) ---------- */
function supaDb(sb){
  const cache={};const subs={};
  const merge=(t,p)=>{const o=JSON.parse(JSON.stringify(t||{}));(function m(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=a[k]&&typeof a[k]==='object'?a[k]:{};m(a[k],b[k])}else a[k]=b[k]}})(o,p);return o};
  const snapDoc=(id,data)=>({id,exists:data!=null,data:()=>data==null?undefined:data,metadata:{fromCache:false,hasPendingWrites:false}});
  const colCache=c=>cache[c]||(cache[c]={});
  const emit=c=>{(subs[c]||[]).forEach(fn=>fn())};
  const apply=(c,id,data)=>{const cc=colCache(c);if(data==null)delete cc[id];else cc[id]=data;emit(c)};
  const loaded={};
  async function load(c){if(loaded[c])return loaded[c];loaded[c]=(async()=>{const {data,error}=await sb.from('docs').select('id,data').eq('col',c);if(error)throw error;const cc=colCache(c);data.forEach(r=>cc[r.id]=r.data);
    sb.channel('docs-'+c).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'col=eq.'+c},p=>{if(p.eventType==='DELETE'){if(p.old&&p.old.col===c)apply(c,p.old.id,null)}else apply(c,p.new.id,p.new.data)}).subscribe()})();return loaded[c]}
  const split=path=>{const i=path.lastIndexOf('/');return[path.slice(0,i),path.slice(i+1)]};
  function doc(path){const [c,id]=split(path);return{id,path,
    async get(){await load(c);return snapDoc(id,colCache(c)[id])},
    async set(d){const v=JSON.parse(JSON.stringify(d));apply(c,id,v);const {error}=await sb.from('docs').upsert({col:c,id,data:v,updated_at:new Date().toISOString()});if(error)throw error},
    async update(p){await load(c);const cur=colCache(c)[id];if(cur==null)throw{code:'invalid_argument',message:'missing doc'};const v=merge(cur,p);apply(c,id,v);const {error}=await sb.from('docs').upsert({col:c,id,data:v,updated_at:new Date().toISOString()});if(error)throw error},
    async delete(){apply(c,id,null);const {error}=await sb.from('docs').delete().eq('col',c).eq('id',id);if(error)throw error},
    async acquire(){return{acquired:true}},
    onSnapshot(next,err){const fn=()=>next(snapDoc(id,colCache(c)[id]));(subs[c]=subs[c]||[]).push(fn);load(c).then(fn).catch(e=>err&&err({code:'unavailable',message:String(e.message||e)}));return()=>{subs[c]=(subs[c]||[]).filter(x=>x!==fn)}}}}
  function collection(c){return{path:c,doc:id=>doc(c+'/'+(id||('d'+Math.random().toString(36).slice(2,12)))),
    onSnapshot(next,err){const fn=()=>{const cc=colCache(c);next({docs:Object.keys(cc).sort().map(id=>snapDoc(id,cc[id])),size:Object.keys(cc).length,empty:!Object.keys(cc).length,metadata:{fromCache:false,hasPendingWrites:false}})};(subs[c]=subs[c]||[]).push(fn);load(c).then(fn).catch(e=>err&&err({code:'unavailable',message:String(e.message||e)}));return()=>{subs[c]=(subs[c]||[]).filter(x=>x!==fn)}}}}
  return{doc,collection};
}
async function migrateV2(sb){
  const {data}=await sb.from('docs').select('data').eq('col','meta').eq('id','seed').maybeSingle();if(data&&data.data&&data.data.version>=2)return;
  const now=new Date().toISOString();const rows=[{col:'stats',id:'ratings',data:SEED.ratings,updated_at:now},...(SEED.reviews||[]).map(r=>{const{id,...d}=r;return{col:'reviews',id,data:d,updated_at:now}})];
  await sb.from('docs').upsert(rows,{ignoreDuplicates:true});await sb.from('docs').upsert({col:'meta',id:'seed',data:{version:2},updated_at:now});
}
async function seedIfEmpty(sb){
  const {count,error}=await sb.from('docs').select('id',{count:'exact',head:true}).eq('col','menu');if(error||count>0)return;
  const rows=[];const now=new Date().toISOString();const add=(col,id,data)=>rows.push({col,id,data,updated_at:now});
  SEED.menu.forEach(m=>{const{id,...d}=m;add('menu',id,d)});SEED.orders.forEach(o=>{const{id,...d}=o;add('orders',id,d)});SEED.specials.forEach(s=>{const{id,...d}=s;add('specials',id,d)});
  add('stats','history',SEED.history);add('stats','dishes',SEED.dstats);add('stats','weeks',SEED.weeks);
  Object.entries(SEED.plans||{}).forEach(([k,v])=>add('plans',k,v));Object.entries(SEED.purchases||{}).forEach(([k,v])=>add('purchases',k,v));
  add('stock','items',{items:SEED.stock.items});add('stock','recipes',{recipes:SEED.stock.recipes});add('stock','settings',SEED.stock.settings);add('stats','ratings',SEED.ratings);(SEED.reviews||[]).forEach(r=>{const{id,...d}=r;add('reviews',id,d)});add('meta','seed',{version:2});
  await sb.from('docs').upsert(rows,{ignoreDuplicates:true});
}

async function boot(){
  S.cid=store('mk_cid');if(!S.cid){S.cid='c_'+rid();store('mk_cid',S.cid)}
  renderAll();
  setInterval(()=>{if(!S.sheet)renderMain();autopilot()},60000);
  setTimeout(autopilot,2500);
  const c=window.claude;
  if((!c||!c.use)&&window.supabase&&window.SB_URL){
    try{const sb=window.supabase.createClient(window.SB_URL,window.SB_KEY);await seedIfEmpty(sb);await migrateV2(sb);db=supaDb(sb);S.live=true}catch(e){toast('Could not reach the database. Showing demo data.');return}
  }else{
  if(!c||!c.use)return;
  let d=null;try{d=await c.use('db')}catch(e){}
  if(!d)return;
  db=d;S.live=true;
  try{const u=await c.use('user');if(u){const id=await u.id();if(id)S.cid=id}}catch(e){}
  }
  S.menu=[];S.orders=[];S.specials=[];S.history=null;S.reviews=[];S.ratings=null;S.plans={};S.stock=null;S.purchases={};S.dstats=null;S.weeks=null;renderAll();
  if(c&&c.use)c.use('sample').then(f=>{if(f){sampleFn=f;renderMain()}}).catch(()=>{});
  const onErr=e=>toast('Lost connection to the kitchen. Reload to reconnect.');
  const sub=k=>db.collection(k).onSnapshot(s=>{S[k]=s.docs.map(x=>({id:x.id,...x.data()}));S.loaded[k]=true;renderMain();renderCartBar()},onErr);
  sub('menu');sub('orders');sub('specials');
  const stk={};const stDone=()=>{if(stk.items&&stk.recipes&&stk.settings){S.stock={items:stk.items.items||{},recipes:stk.recipes.recipes||{},settings:stk.settings};renderMain()}};
  ['items','recipes','settings'].forEach(k=>db.doc('stock/'+k).onSnapshot(s=>{stk[k]=s.exists?s.data():null;stDone()},onErr));
  db.collection('purchases').onSnapshot(s=>{S.purchases=Object.fromEntries(s.docs.map(x=>[x.id,x.data()]));renderMain()},onErr);
  setTimeout(autopilot,6000);
  db.collection('reviews').onSnapshot(s=>{S.reviews=s.docs.map(x=>({id:x.id,...x.data()}));renderMain()},onErr);
  db.doc('stats/ratings').onSnapshot(s=>{S.ratings=s.exists?s.data():null;renderMain()},onErr);
  db.doc('stats/dishes').onSnapshot(s=>{S.dstats=s.exists?s.data():null;renderMain()},onErr);
  db.doc('stats/weeks').onSnapshot(s=>{S.weeks=s.exists?s.data():null;renderMain()},onErr);
  db.collection('plans').onSnapshot(s=>{S.plans=Object.fromEntries(s.docs.map(x=>[x.id,x.data()]));renderMain()},onErr);
  db.doc('stats/history').onSnapshot(s=>{S.history=s.exists?s.data():null;renderMain()},onErr);
}
boot();
